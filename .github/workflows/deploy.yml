name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/286930013282/locations/global/workloadIdentityPools/github/providers/stopwatch-web-repo
          service_account: github-deployer@stopwatch-web-d778a.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        run: npx --yes firebase-tools@latest deploy --only hosting --project stopwatch-web-d778a --non-interactive
